<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD1 - Exo 2 : Leaflet</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; border-radius: 8px; }
        #info { margin-top: 15px; padding: 10px; background: #eef; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Exercice 2 : Carte Leaflet</h1>
    <div id="map"></div>
    <div id="info">Recherche de votre position...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const niceCoords = [43.7034, 7.2663];
        const marseilleCoords = [43.2965, 5.3698];

        const map = L.map('map').setView(niceCoords, 9);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // 1. Marqueurs Nice & Marseille
        L.marker(niceCoords).addTo(map).bindPopup('<b>Nice</b><br>Centre-ville');
        L.marker(marseilleCoords).addTo(map).bindPopup('<b>Marseille</b>');

        // 2. Triangle des Bermudes
        const bermudes = [
            [25.774, -80.190],
            [18.466, -66.118],
            [32.321, -64.757]
        ];
        L.polygon(bermudes, { color: 'red' }).addTo(map).bindPopup('Triangle des Bermudes');

        // 3. Données GeoJSON (communes des Alpes-Maritimes)
        fetch('https://geo.api.gouv.fr/departements/06/communes?geometry=contour&format=geojson')
            .then(res => res.json())
            .then(geojsonData => {
                L.geoJSON(geojsonData, {
                    style: { color: '#4a90e2', weight: 1, fillOpacity: 0.1 }
                }).addTo(map);
            });

        // 4. Géolocalisation, Cercle, Calcul de distance et Route OSRM
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude, longitude, accuracy } = pos.coords;
                const userCoords = [latitude, longitude];

                map.setView(userCoords, 11);

                L.marker(userCoords).addTo(map).bindPopup('<b>Ma position</b>').openPopup();

                // Cercle de précision
                L.circle(userCoords, {
                    radius: accuracy || 500,
                    color: 'blue',
                    fillColor: '#30f',
                    fillOpacity: 0.2
                }).addTo(map);

                // Vol d'oiseau (ligne droite)
                L.polyline([marseilleCoords, userCoords], { color: 'orange', weight: 2, dashArray: '5, 10' }).addTo(map);

                const distanceKm = (map.distance(marseilleCoords, userCoords) / 1000).toFixed(2);
                document.getElementById('info').innerHTML = `📍 Distance (vol d'oiseau) : <strong>${distanceKm} km</strong> (Précision : ${accuracy} m)<br>Calcul de l'itinéraire routier en cours...`;

                // 5. Calcul de la route en voiture via l'API OSRM
                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${longitude},${latitude};${marseilleCoords[1]},${marseilleCoords[0]}?overview=full&geometries=geojson`;

                fetch(osrmUrl)
                    .then(res => res.json())
                    .then(data => {
                        if (data.routes && data.routes.length > 0) {
                            const routeGeometry = data.routes[0].geometry;
                            const routeDistanceKm = (data.routes[0].distance / 1000).toFixed(2);
                            const durationMin = Math.round(data.routes[0].duration / 60);

                            // Affichage du tracé routier en vert sur la carte
                            L.geoJSON(routeGeometry, {
                                style: { color: 'green', weight: 5, opacity: 0.8 }
                            }).addTo(map);

                            document.getElementById('info').innerHTML = `
                                Distance vol d'oiseau : <strong>${distanceKm} km</strong><br>
                                Trajet en voiture : <strong>${routeDistanceKm} km</strong> (~${durationMin} min)
                            `;
                        }
                    })
                    .catch(err => console.error("Erreur OSRM :", err));

            }, err => {
                document.getElementById('info').innerHTML = "<span style='color:red;'>⚠️ Veuillez activer le GPS pour calculer la route.</span>";
            }, { enableHighAccuracy: true });
        }
    </script>

</body>
</html>
