<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD1 - Exo 2 : Leaflet</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
        #info { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Exercice 2 : Carte Leaflet</h1>
    <div id="map"></div>
    <div id="info"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([43.7034, 7.2663], 10);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // 1. Marqueur sur Nice
        L.marker([43.7034, 7.2663]).addTo(map).bindPopup('Nice Centre');

        // 2. Coordonnées de Marseille
        const marseilleCoords = [43.2965, 5.3698];
        L.marker(marseilleCoords).addTo(map).bindPopup('Marseille');

        // 3. Triangle des Bermudes
        const bermudes = [
            [25.774, -80.190],
            [18.466, -66.118],
            [32.321, -64.757]
        ];
        L.polygon(bermudes, { color: 'red' }).addTo(map).bindPopup('Triangle des Bermudes');

        // 4. Géolocalisation & Calculs
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude, longitude, accuracy } = pos.coords;
                const userCoords = [latitude, longitude];

                map.setView(userCoords, 12);

                // Marqueur + Cercle de précision
                L.marker(userCoords).addTo(map).bindPopup('Ma position');
                L.circle(userCoords, { radius: accuracy, color: 'blue', fillOpacity: 0.2 }).addTo(map);

                // Ligne entre Marseille et sa position
                L.polyline([marseilleCoords, userCoords], { color: 'orange', weight: 3 }).addTo(map);

                // Calcul de la distance (en km) avec Leaflet
                const distanceKm = (map.distance(marseilleCoords, userCoords) / 1000).toFixed(2);
                document.getElementById('info').innerText = `Distance entre Marseille et ma position : ${distanceKm} km`;
            });
        }
    </script>

</body>
</html>
