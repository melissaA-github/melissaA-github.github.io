<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD1 - Exo 2 : Leaflet</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>

    <h1>Exercice 2 : Carte Leaflet</h1>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialisation de la carte centrée par défaut sur Nice
        const map = L.map('map').setView([43.7034, 7.2663], 11);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Marqueur sur Nice
        L.marker([43.7034, 7.2663]).addTo(map).bindPopup('Nice Centre');

        // Triangle des Bermudes
        const bermudes = [
            [25.774, -80.190],
            [18.466, -66.118],
            [32.321, -64.757]
        ];
        L.polygon(bermudes, { color: 'red' }).addTo(map).bindPopup('Triangle des Bermudes');

        // Géolocalisation utilisateur + marqueur
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude, longitude } = pos.coords;

                map.setView([latitude, longitude], 13);
                L.marker([latitude, longitude]).addTo(map).bindPopup('Ma position');
            });
        }
    </script>

</body>
</html>
