<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD1 - Exo 1 : Géolocalisation</title>
</head>
<body>

    <h1>Exercice 1 : Géolocalisation</h1>

    <h2>1. Avec getCurrentPosition()</h2>
    <div id="res-current">Chargement...</div>

    <h2>2. Avec watchPosition()</h2>
    <div id="res-watch">Chargement...</div>

    <script>
        const resCurrent = document.getElementById('res-current');
        const resWatch = document.getElementById('res-watch');

        function formatData(pos) {
            const coords = pos.coords;
            const date = new Date(pos.timestamp);

            return `
                <ul>
                    <li><b>Latitude :</b> ${coords.latitude}</li>
                    <li><b>Longitude :</b> ${coords.longitude}</li>
                    <li><b>Altitude :</b> ${coords.altitude ?? 'N/A'}</li>
                    <li><b>Précision :</b> ${coords.accuracy} m</li>
                    <li><b>Vitesse :</b> ${coords.speed ?? 'N/A'}</li>
                    <li><b>Date :</b> ${date.toLocaleString()}</li>
                </ul>
            `;
        }

        function handleError(err, container) {
            container.innerHTML = `<p style="color:red">Erreur (${err.code}): ${err.message}</p>`;
        }

        if ('geolocation' in navigator) {
            // Test getCurrentPosition
            navigator.geolocation.getCurrentPosition(
                pos => resCurrent.innerHTML = formatData(pos),
                err => handleError(err, resCurrent),
                { enableHighAccuracy: true }
            );

            // Test watchPosition
            navigator.geolocation.watchPosition(
                pos => resWatch.innerHTML = formatData(pos),
                err => handleError(err, resWatch),
                { enableHighAccuracy: true }
            );
        } else {
            alert("La géolocalisation n'est pas supportée par ce navigateur.");
        }
    </script>

</body>
</html>
